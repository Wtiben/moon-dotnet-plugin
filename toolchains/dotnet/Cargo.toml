[package]
name = "dotnet_toolchain"
version = "0.2.0"
edition = "2024"
description = ".NET toolchain WASM plugin for moon."
authors = ["Wouter Tiben"]
license = "MIT"
# `repository` and `documentation` move to the moonrepo/plugins URLs in the
# commit that upstreams this crate — until then they must describe this repo,
# since its release workflow copies them into the published OCI annotations.
repository = "https://github.com/Wtiben/moon-dotnet-plugin"
documentation = "https://github.com/Wtiben/moon-dotnet-plugin#readme"
publish = false

# Every toolchain in moonrepo/plugins carries this: `cargo release` rewrites the
# CHANGELOG's `## Unreleased` heading to the version being released.
[package.metadata.release]
pre-release-replacements = [
    { file = "./CHANGELOG.md", search = "Unreleased", replace = "{{version}}" },
]

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
extism-pdk = { workspace = true }
moon_common = { workspace = true }
moon_config = { workspace = true }
moon_pdk = { workspace = true, features = ["schematic"] }
moon_pdk_api = { workspace = true }
moon_target = { workspace = true }
schematic = { workspace = true, features = ["config"] }
serde = { workspace = true }
serde_json = { workspace = true }
starbase_utils = { workspace = true, features = ["yaml"] }

[dev-dependencies]
moon_pdk_test_utils = { workspace = true }
serde_json = { workspace = true }
starbase_sandbox = { workspace = true }
tokio = { workspace = true }

[features]
default = ["wasm"]
wasm = []
