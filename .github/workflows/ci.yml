name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Allows the release workflow to gate publishing on this exact test matrix.
  workflow_call:

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # For setup-rust
  NEXTEST_TEST_THREADS: 3
  NEXTEST_RETRIES: 2

jobs:
  # Formatting and lint. Kept as a separate ubuntu-only job: both gates are
  # OS-independent, so paying for them three times buys nothing.
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: moonrepo/setup-rust@v1
        with:
          components: clippy, rustfmt
          targets: wasm32-wasip1
      - run: cargo fmt --all --check
      # Both variants: `--no-default-features` is what the tests compile, while
      # the wasm target is the only one that type-checks the `wasm`-gated tier
      # functions that actually ship.
      - run: cargo clippy --workspace --all-targets --no-default-features
      - run: cargo clippy --target wasm32-wasip1

  test:
    name: Test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
      fail-fast: false
    steps:
      - uses: actions/checkout@v7
      # The sandbox tests spawn a real `dotnet` process for MSBuild evaluation;
      # -getProperty/-getItem JSON output requires SDK 8+.
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
      - uses: moonrepo/setup-rust@v1
        with:
          bins: cargo-nextest
          targets: wasm32-wasip1
      # Release, not debug: `find_wasm_file` prefers `release/` over `debug/`, so
      # this is the wasm the suite actually loads — and the one `release.yml`
      # publishes, `lto` and `panic = "abort"` included.
      - run: cargo build --target wasm32-wasip1 --release
      - run: cargo nextest run --workspace --no-default-features
